name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them through AppArmor; bwrap needs them for the sandbox tests.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        # GROOT_REQUIRE_SANDBOX turns a skipped sandbox integration test into a
        # failure, so CI proves the bwrap backend instead of silently passing.
        env:
          GROOT_REQUIRE_SANDBOX: "1"
        run: go test ./... -count=1

      - name: Sandbox integration (verbose)
        env:
          GROOT_REQUIRE_SANDBOX: "1"
        run: go test ./internal/sandbox/... -run 'Bwrap|Secret' -count=1 -v
